name: Build & Publish FluentFlyout Unofficial

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:          # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          LATEST=$(curl -s https://api.github.com/repos/unchihugo/FluentFlyout/releases/latest | jq -r .tag_name)
          LAST_BUILT=$(cat last_built_version.txt 2>/dev/null || echo "none")
          echo "Upstream latest: $LATEST | Last built: $LAST_BUILT"
          if [ "$LATEST" != "$LAST_BUILT" ] && [ "$LATEST" != "null" ]; then
            echo "new_version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: windows-latest
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
    steps:
      - name: Checkout upstream source at target tag
        uses: actions/checkout@v4
        with:
          repository: unchihugo/FluentFlyout
          ref: ${{ env.NEW_VERSION }}
          path: upstream

      - name: Checkout this repo (for cert + state file)
        uses: actions/checkout@v4
        with:
          path: self

      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2

      - name: Restore
        run: nuget restore upstream\FluentFlyout.sln

      - name: Build x64 + ARM64 bundle
        run: |
          msbuild upstream\FluentFlyoutMSIX\FluentFlyoutMSIX.wapproj `
            /p:Configuration=Release `
            /p:AppxBundlePlatforms="x64|arm64" `
            /p:AppxBundle=Always `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$PWD\output\"

      - name: Locate signtool
        id: signtool
        run: |
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          echo "path=$($tool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Decode signing certificate
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERT_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("$PWD\signing.pfx", $bytes)

      - name: Sign the bundle
        run: |
          $bundle = Get-ChildItem "output\*.msixbundle" | Select-Object -First 1
          & "${{ steps.signtool.outputs.path }}" sign /f signing.pfx /p "${{ secrets.CERT_PASSWORD }}" /fd SHA256 $bundle.FullName
          echo "BUNDLE_PATH=$($bundle.FullName)" >> $env:GITHUB_ENV
          echo "BUNDLE_NAME=$($bundle.Name)" >> $env:GITHUB_ENV

      - name: Generate checksum + provenance
        run: |
          $hash = (Get-FileHash $env:BUNDLE_PATH -Algorithm SHA256).Hash
          "$hash  $env:BUNDLE_NAME" | Out-File SHA256SUMS.txt -Encoding ascii
          @{
            upstream_repo = "unchihugo/FluentFlyout"
            upstream_tag  = "$env:NEW_VERSION"
            built_at      = (Get-Date -Format "o")
            workflow_run  = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ConvertTo-Json | Out-File build-provenance.json -Encoding utf8

      - name: Copy public cert alongside release
        run: Copy-Item self\signing.cer .\signing.cer

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ${{ env.BUNDLE_PATH }}
            SHA256SUMS.txt
            build-provenance.json
            signing.cer

  publish:
    needs: [check-release, build]
    runs-on: ubuntu-latest
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: ${{ env.NEW_VERSION }}
          body: |
            Unofficial automated build of FluentFlyout ${{ env.NEW_VERSION }}, rebuilt from
            https://github.com/unchihugo/FluentFlyout/releases/tag/${{ env.NEW_VERSION }}

            See build-provenance.json for the exact source commit and build run used.
          files: release-assets/*

      - name: Update version tracker
        run: |
          echo "${{ env.NEW_VERSION }}" > last_built_version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_built_version.txt
          git commit -m "Bump to ${{ env.NEW_VERSION }}"
          git push

      # Chocolatey publish step added once the .nuspec is in place (next step)
