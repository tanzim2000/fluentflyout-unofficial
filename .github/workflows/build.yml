name: Build & Publish FluentFlyout Unofficial

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          LATEST=$(curl -s https://api.github.com/repos/unchihugo/FluentFlyout/releases/latest | jq -r .tag_name)
          LAST_BUILT=$(cat last_built_version.txt 2>/dev/null || echo "none")
          echo "Upstream latest: $LATEST | Last built: $LAST_BUILT"
          if [ "$LATEST" != "$LAST_BUILT" ] && [ "$LATEST" != "null" ]; then
            echo "new_version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
    steps:
      - name: Checkout upstream source at target tag
        uses: actions/checkout@v4
        with:
          repository: unchihugo/FluentFlyout
          ref: ${{ env.NEW_VERSION }}
          path: upstream

      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2

      - name: Restore for ${{ matrix.platform }}
        run: msbuild upstream\FluentFlyout.sln /t:Restore /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Build ${{ matrix.platform }} package (unbundled)
        run: |
          msbuild upstream\FluentFlyoutMSIX\FluentFlyoutMSIX.wapproj `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$PWD\output\${{ matrix.platform }}\"

      - name: Upload single-arch package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: output\${{ matrix.platform }}\**\*.msix

  bundle-sign-publish:
    needs: [check-release, build]
    runs-on: windows-latest
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
    steps:
      - name: Checkout this repo (for cert + state file)
        uses: actions/checkout@v4
        with:
          path: self

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: false

      - name: Locate makeappx and signtool
        id: tools
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Select-Object -Last 1
          $signtool  = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe"  | Select-Object -Last 1
          echo "makeappx=$($makeappx.FullName)" >> $env:GITHUB_OUTPUT
          echo "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Collect .msix files into one folder
        run: |
          New-Item -ItemType Directory -Path bundle-input -Force | Out-Null
          Get-ChildItem -Recurse -Path packages -Filter *.msix | Copy-Item -Destination bundle-input

      - name: Create the bundle
        run: |
          & "${{ steps.tools.outputs.makeappx }}" bundle /d bundle-input /p output\FluentFlyout.msixbundle /o

      - name: Decode signing certificate
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERT_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("$PWD\signing.pfx", $bytes)

      - name: Sign the bundle
        run: |
          & "${{ steps.tools.outputs.signtool }}" sign /f signing.pfx /p "${{ secrets.CERT_PASSWORD }}" /fd SHA256 output\FluentFlyout.msixbundle
          echo "BUNDLE_NAME=FluentFlyout_$env:NEW_VERSION.msixbundle" >> $env:GITHUB_ENV
          Rename-Item output\FluentFlyout.msixbundle "FluentFlyout_$env:NEW_VERSION.msixbundle"

      - name: Generate checksum + provenance
        run: |
          $hash = (Get-FileHash "output\$env:BUNDLE_NAME" -Algorithm SHA256).Hash
          "$hash  $env:BUNDLE_NAME" | Out-File output\SHA256SUMS.txt -Encoding ascii
          @{
            upstream_repo = "unchihugo/FluentFlyout"
            upstream_tag  = "$env:NEW_VERSION"
            built_at      = (Get-Date -Format "o")
            workflow_run  = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ConvertTo-Json | Out-File output\build-provenance.json -Encoding utf8
          Copy-Item self\signing.cer output\signing.cer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: ${{ env.NEW_VERSION }}
          body: |
            Unofficial automated build of FluentFlyout ${{ env.NEW_VERSION }}, rebuilt from
            https://github.com/unchihugo/FluentFlyout/releases/tag/${{ env.NEW_VERSION }}

            See build-provenance.json for the exact source commit and build run used.
          files: output/*

      - name: Update version tracker
        run: |
          echo "${{ env.NEW_VERSION }}" > self\last_built_version.txt
          cd self
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_built_version.txt
          git commit -m "Bump to ${{ env.NEW_VERSION }}"
          git push

      # Chocolatey publish step added once the .nuspec is in place (next step)
