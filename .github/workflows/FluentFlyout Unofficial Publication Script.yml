name: Build & Publish FluentFlyout Unofficial

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild even if this version was already built?'
        type: boolean
        default: false
      export_nupkg:
        description: 'Export .nupkg as a downloadable file?'
        type: boolean
        default: false
      publish_chocolatey:
        description: 'Publish to Chocolatey?'
        type: boolean
        default: true
      mark_as_untested:
        description: 'Tag the Chocolatey package as "-untested" (SemVer prerelease)?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  check-release:
    name: Checking For New Release
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      should_build: ${{ steps.check.outputs.should_build }}
      export_nupkg: ${{ steps.options.outputs.export_nupkg }}
      publish_choco: ${{ steps.options.outputs.publish_choco }}
      mark_untested: ${{ steps.options.outputs.mark_untested }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        run: |
          LATEST=$(curl -s https://api.github.com/repos/unchihugo/FluentFlyout/releases/latest | jq -r .tag_name)
          # Our own most recent release IS the record of what we last built -
          # no tracker file needed. Using /releases (list) rather than
          # /releases/latest deliberately: /releases/latest EXCLUDES
          # prereleases, and our degraded "installer failed" builds are
          # published as prereleases. Ignoring those would make the pipeline
          # rebuild the same version endlessly every 6 hours.
          #
          # GitHub does NOT document or guarantee a sort order for this
          # list endpoint - there are confirmed real-world cases of it
          # returning releases out of chronological order. So rather than
          # trusting index [0], explicitly pick whichever entry has the
          # latest created_at ourselves. per_page=10 gives headroom in case
          # of any ordering weirdness; "empty or malformed response" also
          # falls back safely to "none" rather than erroring the whole step.
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=10")
          LAST_BUILT=$(echo "$RESPONSE" | jq -r 'if (type == "array") then (max_by(.created_at) // {}) | (.tag_name // "none") else "none" end')
          LAST_BUILT="${LAST_BUILT:-none}"
          echo "Upstream latest: $LATEST | Last built: $LAST_BUILT | Force rebuild: ${{ github.event.inputs.force_rebuild }}"
          if [ "$LATEST" != "$LAST_BUILT" ] && [ "$LATEST" != "null" ]; then
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
          fi
          if { [ "$LATEST" != "$LAST_BUILT" ] || [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; } && [ "$LATEST" != "null" ]; then
            echo "new_version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      # is_new_version (set above) is true only when the upstream tag
      # actually changed - unlike should_build, it stays false on a
      # manual force_rebuild of a version already built, so this doesn't
      # fire on every test re-run.
      - name: Notify (new release detected)
        if: steps.check.outputs.is_new_version == 'true' && env.NTFY_TOPIC != ''
        run: |
          curl -s \
            -H "Title: New FluentFlyout release detected" \
            -H "Priority: default" \
            -H "Tags: eyes" \
            -d "Upstream published ${{ steps.check.outputs.new_version }}. Starting the build now." \
            "https://ntfy.sh/$NTFY_TOPIC"

      # Resolves the checkbox options for both manual runs (uses whatever was checked)
      # and scheduled/automatic runs (no inputs exist, so the defaults below apply).
      - id: options
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "export_nupkg=${{ github.event.inputs.export_nupkg }}" >> "$GITHUB_OUTPUT"
            echo "publish_choco=${{ github.event.inputs.publish_chocolatey }}" >> "$GITHUB_OUTPUT"
            echo "mark_untested=${{ github.event.inputs.mark_as_untested }}" >> "$GITHUB_OUTPUT"
          else
            echo "export_nupkg=false" >> "$GITHUB_OUTPUT"
            echo "publish_choco=true" >> "$GITHUB_OUTPUT"
            echo "mark_untested=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Building ${{ matrix.platform }} Package
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
    steps:
      - name: Checkout upstream source at target tag
        uses: actions/checkout@v5
        with:
          repository: unchihugo/FluentFlyout
          ref: ${{ env.NEW_VERSION }}
          path: upstream

      - name: Patch package identity to match our signing certificate
        run: |
          $manifest = "upstream\FluentFlyoutMSIX\Package.appxmanifest"
          (Get-Content $manifest -Raw) -replace 'Publisher="[^"]*"', 'Publisher="CN=tanzim2000, O=FluentFlyout Unofficial Builds"' | Set-Content $manifest
          Select-String -Path $manifest -Pattern 'Publisher='

      - name: Patch About page with unofficial build attribution
        run: |
          # Adds a single line crediting this repo as the distributor, right
          # next to the existing GitHub link at the bottom of the About page.
          # Leaves everything else on the page - including upstream's own
          # Developers/Translators credits - completely untouched.
          $aboutXaml = "upstream\FluentFlyoutWPF\Pages\AboutPage.xaml"
          $anchor = '                <ui:Anchor Appearance="Transparent" Content="{DynamicResource GitHubRepoLink}" Icon="{ui:SymbolIcon Open24}" NavigateUri="https://github.com/unchihugo/FluentFlyout" Margin="12,0,0,0" />'
          $newLine = '                <ui:Anchor Appearance="Transparent" Content="Unofficial build by tanzim2000 and Claude" Icon="{ui:SymbolIcon ArrowDownload24}" NavigateUri="https://github.com/tanzim2000/fluentflyout-unofficial" Margin="12,0,0,0" />'

          $before = Get-Content $aboutXaml -Raw
          $after = $before -replace [regex]::Escape($anchor), "$anchor`n$newLine"

          # HARD REQUIREMENT: if the anchor text wasn't found (e.g. upstream
          # reformatted this file), -replace silently does nothing and the
          # build would otherwise succeed WITHOUT the credit line ever
          # appearing - with no error, no warning, nothing in the logs.
          # That's not acceptable: no credit line means no build, full stop.
          if ($after -eq $before) {
            Write-Error "FATAL: Could not insert the credit line into AboutPage.xaml - the expected anchor text was not found (upstream likely changed this file). Refusing to build without credit. Update the `$anchor value in build.yml to match the file's current content."
            exit 1
          }

          Set-Content $aboutXaml $after

      - uses: microsoft/setup-msbuild@v3
      - uses: nuget/setup-nuget@v3

      - name: Restore for ${{ matrix.platform }}
        run: msbuild upstream\FluentFlyout.sln /t:Restore /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Build ${{ matrix.platform }} package (unbundled)
        run: |
          msbuild upstream\FluentFlyout.sln `
            /t:FluentFlyoutMSIX `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:SelfContained=false `
            /p:SatelliteResourceLanguages=en `
            /p:AppxPackageDir="$PWD\output\${{ matrix.platform }}\"

      - name: Upload single-arch package
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.platform }}
          path: output\${{ matrix.platform }}\**\*.msix

  sign-packages:
    name: Signing Packages
    needs: [check-release, build]
    runs-on: windows-latest
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
    steps:
      - name: Checkout this repo (for cert)
        uses: actions/checkout@v5
        with:
          path: self

      - name: Download built packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: packages
          merge-multiple: false

      - name: Locate signtool
        id: tools
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          echo "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Decode signing certificate
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERT_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("$PWD\signing.pfx", $bytes)

      - name: Sign each architecture's package separately
        run: |
          New-Item -ItemType Directory -Path output -Force | Out-Null
          $shaLines = @()
          foreach ($platform in @("x64", "ARM64")) {
            $msix = Get-ChildItem -Recurse -Path "packages\package-$platform" -Filter *.msix | Select-Object -First 1
            $destName = "FluentFlyout_${env:NEW_VERSION}_$platform.msix"
            Copy-Item $msix.FullName "output\$destName"
            & "${{ steps.tools.outputs.signtool }}" sign /f signing.pfx /p "${{ secrets.CERT_PASSWORD }}" /fd SHA256 "output\$destName"
            $hash = (Get-FileHash "output\$destName" -Algorithm SHA256).Hash
            $shaLines += "$hash  $destName"
          }
          # The cert also needs a recorded checksum - Chocolatey's package
          # validator requires every remote download in an install script
          # to be checksum-verified, including signing.cer.
          Copy-Item self\signing.cer output\signing.cer
          $certHash = (Get-FileHash "output\signing.cer" -Algorithm SHA256).Hash
          $shaLines += "$certHash  signing.cer"
          $shaLines | Out-File output\SHA256SUMS.txt -Encoding ascii

      - name: Generate provenance
        run: |
          @{
            upstream_repo = "unchihugo/FluentFlyout"
            upstream_tag  = "$env:NEW_VERSION"
            built_at      = (Get-Date -Format "o")
            workflow_run  = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ConvertTo-Json | Out-File output\build-provenance.json -Encoding utf8

      - name: Upload signed release assets
        uses: actions/upload-artifact@v6
        with:
          name: signed-release
          path: output\*

  package-installer:
    name: Building Installer
    needs: [check-release, sign-packages]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile FluentFlyoutInstaller.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FluentFlyoutInstaller.iss

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: installer-exe
          path: installer\Output\FluentFlyout_Installer.exe

  smoke-test:
    name: Smoke Testing Build
    needs: [check-release, sign-packages, package-installer]
    runs-on: windows-latest
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    outputs:
      msix_pass: ${{ steps.tests.outputs.msix_pass }}
      exe_pass: ${{ steps.tests.outputs.exe_pass }}
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@v7
        with:
          name: signed-release
          path: output

      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: installer-exe
          path: output

      - name: Run installs and report results
        id: tests
        run: |
          $version = "$env:NEW_VERSION"
          $results = @()
          $msixPass = $true
          $exePass = $true

          # --- Test 1: Direct MSIX install (x64) ---
          # x64 only - GitHub-hosted Windows runners are x64, so an ARM64
          # .msix can't actually be installed here. ARM64 still needs
          # manual Sandbox/real-hardware testing, same as before.
          # This test matters most: a failure here means the release is
          # cancelled outright, regardless of how Test 2 goes - a broken
          # .msix makes the installer around it pointless either way.
          Write-Host "=== Test 1: Direct MSIX install (x64) ==="
          $msixPath = "output\FluentFlyout_${version}_x64.msix"
          $certPath = "output\signing.cer"
          try {
            Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            Add-AppxPackage -Path $msixPath -ErrorAction Stop
            $pkg = Get-AppxPackage -Name "*FluentFlyout*"
            if ($pkg) {
              $results += "PASS|Test 1 - Direct MSIX install (x64)|Installed and verified via Get-AppxPackage ($($pkg.PackageFullName))."
              Remove-AppxPackage -Package $pkg.PackageFullName -ErrorAction SilentlyContinue
            } else {
              $msixPass = $false
              $results += "FAIL|Test 1 - Direct MSIX install (x64)|Add-AppxPackage completed but Get-AppxPackage found no match afterward."
            }
          } catch {
            $msixPass = $false
            $results += "FAIL|Test 1 - Direct MSIX install (x64)|$($_.Exception.Message)"
          }

          # --- Test 2: FluentFlyoutInstaller.exe, silent ---
          # If this fails but Test 1 passed, the release still goes out
          # (as a prerelease, .msix/cert only, no installer .exe attached) -
          # a working .msix is still useful even if its wrapper isn't.
          Write-Host "=== Test 2: FluentFlyoutInstaller.exe (silent) ==="
          $installerLog = "$env:TEMP\installer-test.log"
          try {
            $proc = Start-Process -FilePath "output\FluentFlyout_Installer.exe" `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/LOG=$installerLog" `
              -Wait -PassThru -ErrorAction Stop
            $pkg2 = Get-AppxPackage -Name "*FluentFlyout*"
            if ($proc.ExitCode -eq 0 -and $pkg2) {
              $results += "PASS|Test 2 - Full installer (FluentFlyout_Installer.exe)|Ran silently end-to-end and verified via Get-AppxPackage ($($pkg2.PackageFullName))."
              Remove-AppxPackage -Package $pkg2.PackageFullName -ErrorAction SilentlyContinue
            } else {
              $exePass = $false
              $logTail = if (Test-Path $installerLog) { (Get-Content $installerLog -Tail 10) -join "; " } else { "(no log produced)" }
              $results += "FAIL|Test 2 - Full installer (FluentFlyout_Installer.exe)|Exit code $($proc.ExitCode). App found after run: $([bool]$pkg2). Last log lines: $logTail"
            }
          } catch {
            $exePass = $false
            $results += "FAIL|Test 2 - Full installer (FluentFlyout_Installer.exe)|$($_.Exception.Message)"
          }

          echo "msix_pass=$($msixPass.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          echo "exe_pass=$($exePass.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # --- Build the human-readable report ---
          $overallPass = $msixPass -and $exePass
          if (-not $msixPass) {
            $statusLine = "MSIX FAILED - RELEASE CANCELLED"
          } elseif (-not $exePass) {
            $statusLine = "INSTALLER FAILED - RELEASING MSIX ONLY, AS A PRERELEASE (no Chocolatey this run)"
          } else {
            $statusLine = "ALL TESTS PASSED"
          }
          $body = "Smoke test results for $version`n$statusLine`n`n"
          foreach ($r in $results) {
            $parts = $r -split '\|', 3
            $icon = if ($parts[0] -eq 'PASS') { "PASS" } else { "FAIL" }
            $body += "[$icon] $($parts[1])`n$($parts[2])`n`n"
          }
          $body += "Note: ARM64 build not tested here (no ARM64 GitHub-hosted runner available) - Sandbox/manual testing still needed for that architecture.`n`n"
          $body += "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          Write-Host $body

          if ($env:NTFY_TOPIC) {
            $headers = @{
              "Title"    = "Smoke test results: $version"
              "Priority" = if ($overallPass) { "low" } else { "high" }
              "Tags"     = if ($overallPass) { "white_check_mark" } else { "x" }
            }
            Invoke-RestMethod -Uri "https://ntfy.sh/$env:NTFY_TOPIC" -Method Post -Body $body -Headers $headers
          }

          # Only the MSIX test blocks the release entirely. An installer
          # failure alone does NOT fail this job - publish still needs to
          # run (in prerelease/msix-only mode), which requires this job to
          # report success.
          if (-not $msixPass) {
            exit 1
          }

  publish:
    name: Publishing Release
    needs: [check-release, sign-packages, package-installer, smoke-test]
    runs-on: ubuntu-latest
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      # No checkout needed here - the release is created from downloaded
      # artifacts, and there's no longer a tracker file to commit back.
      - name: Download signed release assets
        uses: actions/download-artifact@v7
        with:
          name: signed-release
          path: output

      - name: Download installer
        if: needs.smoke-test.outputs.exe_pass == 'true'
        uses: actions/download-artifact@v7
        with:
          name: installer-exe
          path: output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: ${{ env.NEW_VERSION }}
          prerelease: ${{ needs.smoke-test.outputs.exe_pass != 'true' }}
          body: |
            Unofficial automated build of FluentFlyout ${{ env.NEW_VERSION }}, rebuilt from
            https://github.com/unchihugo/FluentFlyout/releases/tag/${{ env.NEW_VERSION }}

            See build-provenance.json for the exact source commit and build run used.

            ${{ needs.smoke-test.outputs.exe_pass == 'true' && 'New here? Download FluentFlyout_Installer.exe below and just run it - it handles everything (architecture detection, certificate trust, install, cleanup) on its own.' || '**Marked as a prerelease**: FluentFlyoutInstaller.exe failed automated smoke testing this build, so it is not attached. The .msix itself passed testing and is safe to use via the manual install steps in the README.' }}
          files: output/*

  publish-chocolatey:
    name: Publishing to Chocolatey
    needs: [check-release, sign-packages, smoke-test, publish]
    if: needs.smoke-test.outputs.exe_pass == 'true' && needs.check-release.outputs.publish_choco == 'true'
    runs-on: windows-latest
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    outputs:
      pkg_ver: ${{ steps.prep.outputs.pkg_ver }}
      choco_attempted: ${{ steps.verify.outputs.attempted }}
      choco_pushed: ${{ steps.verify.outputs.pushed }}
      choco_verified: ${{ steps.verify.outputs.verified }}
      choco_error: ${{ steps.verify.outputs.error }}
    steps:
      - uses: actions/checkout@v5

      - name: Download signed release assets (for checksums)
        uses: actions/download-artifact@v7
        with:
          name: signed-release
          path: output

      - name: Extract checksums
        id: sums
        run: |
          $lines = Get-Content output\SHA256SUMS.txt
          $x64Hash = (($lines | Where-Object { $_ -match "_x64\.msix" }) -split '\s+')[0]
          $armHash = (($lines | Where-Object { $_ -match "_ARM64\.msix" }) -split '\s+')[0]
          $certHash = (($lines | Where-Object { $_ -match "signing\.cer" }) -split '\s+')[0]
          echo "x64_hash=$x64Hash" >> $env:GITHUB_OUTPUT
          echo "arm_hash=$armHash" >> $env:GITHUB_OUTPUT
          echo "cert_hash=$certHash" >> $env:GITHUB_OUTPUT

      - name: Prepare Chocolatey package
        id: prep
        run: |
          $ver = "${{ env.NEW_VERSION }}".TrimStart('v')
          $markUntested = "${{ needs.check-release.outputs.mark_untested }}"

          # Find the next available revision number by asking Chocolatey
          # itself for this package's existing versions - NOT GitHub's
          # run number, which increments on every scheduled check
          # (even ones that build nothing) and resets whenever this
          # workflow file gets renamed. This way the number only ever
          # grows when a real Chocolatey push has actually happened.
          #
          # This lookup is anchored to the CURRENT version specifically
          # (via the regex below), so an older base version's existing
          # revisions (e.g. 2.13.1.24) never leak into a new base
          # version's count (e.g. 2.13.2 correctly starts at .1).
          #
          # If this call fails outright, we do NOT guess - a wrong guess
          # risks colliding with or skipping real version history. Instead
          # this notifies and stops the job.
          try {
            $resp = Invoke-WebRequest -Uri "https://community.chocolatey.org/api/v2/FindPackagesById()?id='fluentflyout-unofficial'" -UseBasicParsing -ErrorAction Stop
            $existingVersions = [regex]::Matches($resp.Content, '<d:Version>([^<]+)</d:Version>') | ForEach-Object { $_.Groups[1].Value }
          } catch {
            $errMsg = $_.Exception.Message
            Write-Error "Could not reach the Chocolatey API to determine the next version number: $errMsg"
            if ($env:NTFY_TOPIC) {
              Invoke-RestMethod -Uri "https://ntfy.sh/$env:NTFY_TOPIC" -Method Post -Body "Could not reach the Chocolatey API to determine the next package version. Nothing was pushed. Error: $errMsg" -Headers @{
                "Title"    = "FluentFlyout Unofficial: Chocolatey publish aborted"
                "Priority" = "high"
                "Tags"     = "x"
              }
            }
            exit 1
          }
          $pattern = '^' + [regex]::Escape($ver) + '\.(\d+)(-untested)?$'
          $maxRevision = 0
          foreach ($v in $existingVersions) {
            if ($v -match $pattern) {
              $rev = [int]$matches[1]
              if ($rev -gt $maxRevision) { $maxRevision = $rev }
            }
          }
          $nextRevision = $maxRevision + 1

          $pkgVer = if ($markUntested -eq 'true') { "$ver.$nextRevision-untested" } else { "$ver.$nextRevision" }
          echo "PKG_VER=$pkgVer" >> $env:GITHUB_ENV
          echo "pkg_ver=$pkgVer" >> $env:GITHUB_OUTPUT
          (Get-Content chocolatey\fluentflyout-unofficial.nuspec -Raw) -replace '__VERSION__', $pkgVer | Set-Content chocolatey\fluentflyout-unofficial.nuspec
          (Get-Content chocolatey\tools\chocolateyinstall.ps1 -Raw) `
            -replace '__X64_SHA256__', "${{ steps.sums.outputs.x64_hash }}" `
            -replace '__ARM64_SHA256__', "${{ steps.sums.outputs.arm_hash }}" `
            -replace '__CERT_SHA256__', "${{ steps.sums.outputs.cert_hash }}" `
            | Set-Content chocolatey\tools\chocolateyinstall.ps1

      - name: Pack Chocolatey package (not pushed yet — see below)
        run: |
          choco pack chocolatey\fluentflyout-unofficial.nuspec --outputdirectory chocolatey

      - name: Upload .nupkg for local testing
        if: needs.check-release.outputs.export_nupkg == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: chocolatey-package
          path: chocolatey\*.nupkg

      # continue-on-error so a push failure (e.g. the 403s we've hit before)
      # doesn't kill the job before the Verify step below can build a
      # proper report explaining what happened.
      - name: Push to Chocolatey
        id: push
        if: needs.check-release.outputs.publish_choco == 'true'
        continue-on-error: true
        run: |
          choco push "chocolatey\fluentflyout-unofficial.$env:PKG_VER.nupkg" --source https://push.chocolatey.org/ --api-key "${{ secrets.CHOCO_API_KEY }}"

      # A successful `choco push` only means Chocolatey ACCEPTED the
      # package for processing - not that it's actually live. This polls
      # Chocolatey's own API until the version genuinely appears (or a
      # timeout is hit), so the final report reflects reality rather than
      # just "the push command didn't error."
      - name: Verify Chocolatey listing
        id: verify
        run: |
          $attempted = "${{ needs.check-release.outputs.publish_choco }}"
          echo "attempted=$attempted" >> $env:GITHUB_OUTPUT

          if ($attempted -ne 'true') {
            echo "pushed=false" >> $env:GITHUB_OUTPUT
            echo "verified=false" >> $env:GITHUB_OUTPUT
            echo "error=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $pushOutcome = "${{ steps.push.outcome }}"
          if ($pushOutcome -ne 'success') {
            echo "pushed=false" >> $env:GITHUB_OUTPUT
            echo "verified=false" >> $env:GITHUB_OUTPUT
            echo "error=choco push command itself failed (see the Push to Chocolatey step's log for the exact error, e.g. a 403)." >> $env:GITHUB_OUTPUT
            exit 1
          }
          echo "pushed=true" >> $env:GITHUB_OUTPUT

          $pkgVer = "$env:PKG_VER"
          $maxWaitSeconds = 180
          $intervalSeconds = 20
          $elapsed = 0
          $verified = $false
          while ($elapsed -lt $maxWaitSeconds) {
            try {
              $uri = "https://community.chocolatey.org/api/v2/Packages(Id='fluentflyout-unofficial',Version='$pkgVer')"
              $resp = Invoke-RestMethod -Uri $uri -Method Get -ErrorAction Stop
              if ($resp) { $verified = $true; break }
            } catch {
              # Not listed yet, or a transient error - keep waiting.
            }
            Start-Sleep -Seconds $intervalSeconds
            $elapsed += $intervalSeconds
          }

          if ($verified) {
            echo "verified=true" >> $env:GITHUB_OUTPUT
            echo "error=" >> $env:GITHUB_OUTPUT
          } else {
            echo "verified=false" >> $env:GITHUB_OUTPUT
            echo "error=Push command succeeded, but the package was not found on the Chocolatey feed after waiting ${maxWaitSeconds}s. It may still appear later - check the package page directly." >> $env:GITHUB_OUTPUT
            exit 1
          }

  publish-report:
    name: Final Publish Report
    needs: [check-release, smoke-test, publish, publish-chocolatey]
    if: always()
    runs-on: ubuntu-latest
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Build and send final report
        if: env.NTFY_TOPIC != ''
        run: |
          MSIX_PASS="${{ needs.smoke-test.outputs.msix_pass }}"
          GITHUB_OK="${{ needs.publish.result == 'success' }}"
          CHOCO_RESULT="${{ needs.publish-chocolatey.result }}"
          CHOCO_VERIFIED="${{ needs.publish-chocolatey.outputs.choco_verified }}"
          CHOCO_ERROR="${{ needs.publish-chocolatey.outputs.choco_error }}"
          PKG_VER="${{ needs.publish-chocolatey.outputs.pkg_ver }}"

          if [ "$MSIX_PASS" = "false" ]; then
            TITLE="FluentFlyout Unofficial ${{ env.NEW_VERSION }} release cancelled"
            PRIORITY="high"
            TAGS="x"
            BODY="Release for ${{ env.NEW_VERSION }} was cancelled: the .msix failed smoke testing, so nothing was published. See the smoke test report for details."
          elif [ "$GITHUB_OK" != "true" ]; then
            TITLE="FluentFlyout Unofficial ${{ env.NEW_VERSION }} publish failed"
            PRIORITY="high"
            TAGS="x"
            BODY="The GitHub Release for ${{ env.NEW_VERSION }} failed to publish. Check the Actions run for details."
          elif [ "$CHOCO_RESULT" = "skipped" ]; then
            TITLE="FluentFlyout Unofficial ${{ env.NEW_VERSION }} published"
            PRIORITY="low"
            TAGS="package"
            BODY="New GitHub Release for ${{ env.NEW_VERSION }} is live. (Chocolatey publishing was not enabled for this run.)"
          elif [ "$CHOCO_VERIFIED" = "true" ]; then
            TITLE="FluentFlyout Unofficial ${{ env.NEW_VERSION }} published"
            PRIORITY="high"
            TAGS="package"
            BODY="New GitHub Release for ${{ env.NEW_VERSION }} is live. Chocolatey package $PKG_VER confirmed live too."
          else
            TITLE="FluentFlyout Unofficial ${{ env.NEW_VERSION }} publish failed"
            PRIORITY="high"
            TAGS="package"
            if [ -n "$CHOCO_ERROR" ]; then
              BODY="New GitHub Release for ${{ env.NEW_VERSION }} is live. But, publishing to Chocolatey has failed. $CHOCO_ERROR"
            else
              BODY="New GitHub Release for ${{ env.NEW_VERSION }} is live. But, publishing to Chocolatey has failed. Check the Actions run for details."
            fi
          fi

          curl -s \
            -H "Title: $TITLE" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -d "$BODY" \
            "https://ntfy.sh/$NTFY_TOPIC"
