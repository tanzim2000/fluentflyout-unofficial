# ==============================================================================
# FluentFlyout Unofficial - Build & Publish Pipeline
# ==============================================================================
#
# Watches upstream (unchihugo/FluentFlyout) for new releases, rebuilds them from
# source, signs them with this project's own certificate, verifies they install
# on a real machine, then publishes to GitHub Releases and Chocolatey.
#
# PIPELINE STAGES
#   check-release ──> build (x64 + ARM64) ──> sign-packages ──> package-installer
#                                                     │                  │
#                                                     └──> smoke-test <──┘
#                                                              │
#                 publish-report <── publish-chocolatey <── publish
#
# FAILURE BEHAVIOUR
#   - Any stage before smoke-test fails    -> nothing published; retried next cron run.
#   - smoke-test .msix fails               -> release cancelled entirely.
#   - smoke-test installer .exe fails only -> release published as a prerelease with
#                                             the .msix only; Chocolatey skipped.
#   - publish-report always runs and sends a single summary notification.
#
# STATE MODEL
#   No state is stored in the repo. "What did we last build?" is answered by this
#   repository's own GitHub Releases, so the pipeline is idempotent and self-healing:
#   a failed run simply leaves the previous release as the newest, and the next
#   scheduled run retries the same version.
#
# REQUIRED SECRETS
#   SIGNING_CERT_PFX_BASE64  Base64-encoded .pfx used to sign the .msix packages.
#   CERT_PASSWORD            Password for the above .pfx.
#   CHOCO_API_KEY            Chocolatey community feed push key.
#   NTFY_TOPIC               ntfy.sh topic for notifications. Optional; all
#                            notification steps are skipped when unset.
# ==============================================================================

name: Build & Publish FluentFlyout Unofficial

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild even if this version was already built?'
        type: boolean
        default: false
      export_nupkg:
        description: 'Export .nupkg as a downloadable file?'
        type: boolean
        default: false
      publish_chocolatey:
        description: 'Publish to Chocolatey?'
        type: boolean
        default: true
      mark_as_untested:
        description: 'Tag the Chocolatey package as "-untested" (SemVer prerelease)?'
        type: boolean
        default: true

permissions:
  contents: write

# Every job sets an explicit timeout-minutes. GitHub's default job limit is six
# hours, which turns a hung step into a silent, day-long stall before anything
# reports failure. The limits below are sized well above normal runtimes so they
# only trigger on genuine hangs.

jobs:
  # ----------------------------------------------------------------------------
  # Determines whether there is a new upstream version worth building, and
  # resolves the run's options. Every downstream job is gated on should_build.
  # ----------------------------------------------------------------------------
  check-release:
    name: Checking For New Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      should_build: ${{ steps.check.outputs.should_build }}
      export_nupkg: ${{ steps.options.outputs.export_nupkg }}
      publish_choco: ${{ steps.options.outputs.publish_choco }}
      mark_untested: ${{ steps.options.outputs.mark_untested }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        run: |
          LATEST=$(curl -s https://api.github.com/repos/unchihugo/FluentFlyout/releases/latest | jq -r .tag_name)

          # This repository's own newest release is the record of what was last
          # built. Two deliberate choices here:
          #
          #   1. Uses /releases (list) rather than /releases/latest. The /latest
          #      endpoint excludes prereleases, and degraded builds are published
          #      as prereleases - ignoring them would make the pipeline rebuild
          #      the same version on every cron tick.
          #   2. Selects by max created_at rather than trusting index [0]. The
          #      list endpoint's ordering is not documented or guaranteed.
          #
          # A malformed or empty response falls back to "none", which reads as
          # "nothing built yet" and allows the build to proceed.
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=10")
          LAST_BUILT=$(echo "$RESPONSE" | jq -r 'if (type == "array") then (max_by(.created_at) // {}) | (.tag_name // "none") else "none" end')
          LAST_BUILT="${LAST_BUILT:-none}"

          echo "Upstream latest: $LATEST | Last built: $LAST_BUILT | Force rebuild: ${{ github.event.inputs.force_rebuild }}"

          # is_new_version tracks a genuine upstream change and drives the
          # notification below. should_build additionally honours force_rebuild,
          # so manual re-runs of an already-built version build without
          # re-notifying.
          if [ "$LATEST" != "$LAST_BUILT" ] && [ "$LATEST" != "null" ]; then
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
          fi

          if { [ "$LATEST" != "$LAST_BUILT" ] || [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; } && [ "$LATEST" != "null" ]; then
            echo "new_version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify (new release detected)
        if: steps.check.outputs.is_new_version == 'true' && env.NTFY_TOPIC != ''
        run: |
          curl -s \
            -H "Title: New FluentFlyout release detected" \
            -H "Priority: default" \
            -H "Tags: eyes" \
            -d "Upstream published ${{ steps.check.outputs.new_version }}. Starting the build now." \
            "https://ntfy.sh/$NTFY_TOPIC"

      # Scheduled runs carry no inputs, so github.event.inputs.* is empty. This
      # normalises both trigger types into a single set of outputs.
      - id: options
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "export_nupkg=${{ github.event.inputs.export_nupkg }}" >> "$GITHUB_OUTPUT"
            echo "publish_choco=${{ github.event.inputs.publish_chocolatey }}" >> "$GITHUB_OUTPUT"
            echo "mark_untested=${{ github.event.inputs.mark_as_untested }}" >> "$GITHUB_OUTPUT"
          else
            echo "export_nupkg=false" >> "$GITHUB_OUTPUT"
            echo "publish_choco=true" >> "$GITHUB_OUTPUT"
            echo "mark_untested=true" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------------
  # Compiles upstream's source at the target tag, once per architecture.
  # Packages are built unsigned here; signing happens in the next job so both
  # architectures are signed by a single consistent step.
  # ----------------------------------------------------------------------------
  build:
    name: Building ${{ matrix.platform }} Package
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        platform: [x64, ARM64]
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
    steps:
      - name: Checkout upstream source at target tag
        uses: actions/checkout@v5
        with:
          repository: unchihugo/FluentFlyout
          ref: ${{ env.NEW_VERSION }}
          path: upstream

      # The manifest Publisher must match the subject of the signing certificate
      # used in sign-packages, or Windows rejects the package at install time.
      - name: Patch package identity to match our signing certificate
        run: |
          $manifest = "upstream\FluentFlyoutMSIX\Package.appxmanifest"
          (Get-Content $manifest -Raw) -replace 'Publisher="[^"]*"', 'Publisher="CN=tanzim2000, O=FluentFlyout Unofficial Builds"' | Set-Content $manifest
          Select-String -Path $manifest -Pattern 'Publisher='

      # Adds a single attribution line to the About page, beside the existing
      # upstream GitHub link. Upstream's own credits are left untouched.
      - name: Patch About page with unofficial build attribution
        run: |
          $aboutXaml = "upstream\FluentFlyoutWPF\Pages\AboutPage.xaml"
          $anchor = '                <ui:Anchor Appearance="Transparent" Content="{DynamicResource GitHubRepoLink}" Icon="{ui:SymbolIcon Open24}" NavigateUri="https://github.com/unchihugo/FluentFlyout" Margin="12,0,0,0" />'
          $newLine = '                <ui:Anchor Appearance="Transparent" Content="Unofficial build by tanzim2000 and Claude" Icon="{ui:SymbolIcon ArrowDownload24}" NavigateUri="https://github.com/tanzim2000/fluentflyout-unofficial" Margin="12,0,0,0" />'

          $before = Get-Content $aboutXaml -Raw
          $after = $before -replace [regex]::Escape($anchor), "$anchor`n$newLine"

          # -replace is a no-op when the pattern does not match, so an upstream
          # reformat of this file would otherwise produce a successful build with
          # the attribution silently missing. Treated as fatal: if the anchor
          # cannot be found, update $anchor to match the file's current content.
          if ($after -eq $before) {
            Write-Error "FATAL: Could not insert the credit line into AboutPage.xaml - the expected anchor text was not found (upstream likely changed this file). Refusing to build without credit. Update the `$anchor value in this workflow to match the file's current content."
            exit 1
          }

          Set-Content $aboutXaml $after

      - uses: microsoft/setup-msbuild@v3
      - uses: nuget/setup-nuget@v3

      - name: Restore for ${{ matrix.platform }}
        run: msbuild upstream\FluentFlyout.sln /t:Restore /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      # Build flags, and why:
      #   AppxBundle=Never              one .msix per architecture, not a bundle
      #   UapAppxPackageBuildMode       sideload target; this is not a Store submission
      #   AppxPackageSigningEnabled     signing is handled centrally in sign-packages
      #   SelfContained=false           framework-dependent; keeps the package small
      #   SatelliteResourceLanguages    English only; drops unused translation assets
      - name: Build ${{ matrix.platform }} package (unbundled)
        run: |
          msbuild upstream\FluentFlyout.sln `
            /t:FluentFlyoutMSIX `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:SelfContained=false `
            /p:SatelliteResourceLanguages=en `
            /p:AppxPackageDir="$PWD\output\${{ matrix.platform }}\"

      - name: Upload single-arch package
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.platform }}
          path: output\${{ matrix.platform }}\**\*.msix

  # ----------------------------------------------------------------------------
  # Signs both architectures, records checksums, and emits build provenance.
  # Produces the "signed-release" artifact consumed by every later job.
  # ----------------------------------------------------------------------------
  sign-packages:
    name: Signing Packages
    needs: [check-release, build]
    runs-on: windows-latest
    # Signing normally completes in seconds. signtool.exe can block indefinitely
    # in some failure modes rather than exiting with an error, so this limit is
    # deliberately tight.
    timeout-minutes: 20
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
    steps:
      - name: Checkout this repo (for cert)
        uses: actions/checkout@v5
        with:
          path: self

      - name: Download built packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: packages
          merge-multiple: false

      # Multiple Windows SDK versions may be installed; take the newest.
      - name: Locate signtool
        id: tools
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          echo "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Decode signing certificate
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERT_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("$PWD\signing.pfx", $bytes)

      # Each architecture is signed independently so a problem with one cannot
      # affect the other. Progress is logged per architecture, and signtool's
      # exit code is checked explicitly, because a failure inside the loop would
      # otherwise be easy to miss in the job log.
      - name: Sign each architecture's package separately
        run: |
          New-Item -ItemType Directory -Path output -Force | Out-Null
          $shaLines = @()

          foreach ($platform in @("x64", "ARM64")) {
            Write-Host "=== Signing $platform ==="

            $msix = Get-ChildItem -Recurse -Path "packages\package-$platform" -Filter *.msix | Select-Object -First 1
            if (-not $msix) {
              Write-Error "No .msix found for $platform - the build job may not have produced one."
              exit 1
            }
            Write-Host "Found: $($msix.FullName)"

            $destName = "FluentFlyout_${env:NEW_VERSION}_$platform.msix"
            Copy-Item $msix.FullName "output\$destName"

            Write-Host "Invoking signtool for $destName..."
            & "${{ steps.tools.outputs.signtool }}" sign /f signing.pfx /p "${{ secrets.CERT_PASSWORD }}" /fd SHA256 "output\$destName"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "signtool failed for $destName with exit code $LASTEXITCODE."
              exit 1
            }
            Write-Host "Signed $destName successfully."

            $hash = (Get-FileHash "output\$destName" -Algorithm SHA256).Hash
            $shaLines += "$hash  $destName"
          }

          # signing.cer is checksummed alongside the packages because the
          # Chocolatey install script downloads it at install time, and
          # Chocolatey's package validator requires every remote download to be
          # checksum-verified.
          Copy-Item self\signing.cer output\signing.cer
          $certHash = (Get-FileHash "output\signing.cer" -Algorithm SHA256).Hash
          $shaLines += "$certHash  signing.cer"

          $shaLines | Out-File output\SHA256SUMS.txt -Encoding ascii
          Write-Host "All signing complete."

      # Lets any consumer trace a published binary back to the exact source
      # commit and workflow run that produced it.
      - name: Generate provenance
        run: |
          @{
            upstream_repo = "unchihugo/FluentFlyout"
            upstream_tag  = "$env:NEW_VERSION"
            built_at      = (Get-Date -Format "o")
            workflow_run  = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ConvertTo-Json | Out-File output\build-provenance.json -Encoding utf8

      - name: Upload signed release assets
        uses: actions/upload-artifact@v6
        with:
          name: signed-release
          path: output\*

  # ----------------------------------------------------------------------------
  # Builds the standalone one-click installer. The installer resolves the current
  # version from this repository's releases at runtime, so it does not need to be
  # rebuilt for each new version - but it is rebuilt here to keep it in sync with
  # any changes to the .iss script.
  # ----------------------------------------------------------------------------
  package-installer:
    name: Building Installer
    needs: [check-release, sign-packages]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile FluentFlyoutInstaller.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FluentFlyoutInstaller.iss

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: installer-exe
          path: installer\Output\FluentFlyout_Installer.exe

  # ----------------------------------------------------------------------------
  # Installs both deliverables on a real Windows runner before anything is
  # published. This job's two outputs determine what the release looks like:
  #
  #   msix_pass=false  -> job fails; release is cancelled entirely.
  #   exe_pass=false   -> job still succeeds; publish degrades to a prerelease
  #                       containing the .msix only, and Chocolatey is skipped.
  # ----------------------------------------------------------------------------
  smoke-test:
    name: Smoke Testing Build
    needs: [check-release, sign-packages, package-installer]
    runs-on: windows-latest
    # Installs an ~85 MB package twice and blocks on the installer process.
    timeout-minutes: 30
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    outputs:
      msix_pass: ${{ steps.tests.outputs.msix_pass }}
      exe_pass: ${{ steps.tests.outputs.exe_pass }}
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@v7
        with:
          name: signed-release
          path: output

      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: installer-exe
          path: output

      - name: Run installs and report results
        id: tests
        run: |
          $version = "$env:NEW_VERSION"
          $results = @()
          $msixPass = $true
          $exePass = $true

          # Test 1 - direct .msix install.
          #
          # x64 only: GitHub-hosted Windows runners are x64, so the ARM64 package
          # cannot be installed here. ARM64 remains covered by manual testing.
          #
          # The certificate is imported into TrustedPeople rather than Root: the
          # signing certificate is a self-signed leaf, not a CA, and the AppX
          # validator only honours leaf certificates from TrustedPeople.
          Write-Host "=== Test 1: Direct MSIX install (x64) ==="
          $msixPath = "output\FluentFlyout_${version}_x64.msix"
          $certPath = "output\signing.cer"
          try {
            Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            Add-AppxPackage -Path $msixPath -ErrorAction Stop
            $pkg = Get-AppxPackage -Name "*FluentFlyout*"
            if ($pkg) {
              $results += "PASS|Test 1 - Direct MSIX install (x64)|Installed and verified via Get-AppxPackage ($($pkg.PackageFullName))."
              Remove-AppxPackage -Package $pkg.PackageFullName -ErrorAction SilentlyContinue
            } else {
              $msixPass = $false
              $results += "FAIL|Test 1 - Direct MSIX install (x64)|Add-AppxPackage completed but Get-AppxPackage found no match afterward."
            }
          } catch {
            $msixPass = $false
            $results += "FAIL|Test 1 - Direct MSIX install (x64)|$($_.Exception.Message)"
          }

          # Test 2 - the installer .exe, end to end. This exercises the full
          # real-world path: version lookup, download, checksum verification,
          # certificate trust, install, and launch-target resolution.
          Write-Host "=== Test 2: FluentFlyoutInstaller.exe (silent) ==="
          $installerLog = "$env:TEMP\installer-test.log"
          try {
            $proc = Start-Process -FilePath "output\FluentFlyout_Installer.exe" `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/LOG=$installerLog" `
              -Wait -PassThru -ErrorAction Stop
            $pkg2 = Get-AppxPackage -Name "*FluentFlyout*"
            if ($proc.ExitCode -eq 0 -and $pkg2) {
              $results += "PASS|Test 2 - Full installer (FluentFlyout_Installer.exe)|Ran silently end-to-end and verified via Get-AppxPackage ($($pkg2.PackageFullName))."
              Remove-AppxPackage -Package $pkg2.PackageFullName -ErrorAction SilentlyContinue
            } else {
              $exePass = $false
              $logTail = if (Test-Path $installerLog) { (Get-Content $installerLog -Tail 10) -join "; " } else { "(no log produced)" }
              $results += "FAIL|Test 2 - Full installer (FluentFlyout_Installer.exe)|Exit code $($proc.ExitCode). App found after run: $([bool]$pkg2). Last log lines: $logTail"
            }
          } catch {
            $exePass = $false
            $results += "FAIL|Test 2 - Full installer (FluentFlyout_Installer.exe)|$($_.Exception.Message)"
          }

          echo "msix_pass=$($msixPass.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          echo "exe_pass=$($exePass.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # Human-readable report, sent to ntfy and also written to the job log.
          $overallPass = $msixPass -and $exePass
          if (-not $msixPass) {
            $statusLine = "MSIX FAILED - RELEASE CANCELLED"
          } elseif (-not $exePass) {
            $statusLine = "INSTALLER FAILED - RELEASING MSIX ONLY, AS A PRERELEASE (no Chocolatey this run)"
          } else {
            $statusLine = "ALL TESTS PASSED"
          }

          $body = "Smoke test results for $version`n$statusLine`n`n"
          foreach ($r in $results) {
            $parts = $r -split '\|', 3
            $icon = if ($parts[0] -eq 'PASS') { "PASS" } else { "FAIL" }
            $body += "[$icon] $($parts[1])`n$($parts[2])`n`n"
          }
          $body += "Note: ARM64 build not tested here (no ARM64 GitHub-hosted runner available) - Sandbox/manual testing still needed for that architecture.`n`n"
          $body += "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          Write-Host $body

          if ($env:NTFY_TOPIC) {
            $headers = @{
              "Title"    = "Smoke test results: $version"
              "Priority" = if ($overallPass) { "low" } else { "high" }
              "Tags"     = if ($overallPass) { "white_check_mark" } else { "x" }
            }
            Invoke-RestMethod -Uri "https://ntfy.sh/$env:NTFY_TOPIC" -Method Post -Body $body -Headers $headers
          }

          # Only a .msix failure aborts the pipeline. An installer-only failure
          # must leave this job successful so publish can still run in degraded
          # (prerelease) mode.
          if (-not $msixPass) {
            exit 1
          }

  # ----------------------------------------------------------------------------
  # Creates the GitHub Release. The release tag always mirrors the upstream tag
  # exactly; Chocolatey versioning is handled separately in the next job.
  # ----------------------------------------------------------------------------
  publish:
    name: Publishing Release
    needs: [check-release, sign-packages, package-installer, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      # No checkout required: the release is assembled entirely from artifacts.
      - name: Download signed release assets
        uses: actions/download-artifact@v7
        with:
          name: signed-release
          path: output

      # Omitted when the installer failed smoke testing, so a known-bad binary
      # is never attached to a release.
      - name: Download installer
        if: needs.smoke-test.outputs.exe_pass == 'true'
        uses: actions/download-artifact@v7
        with:
          name: installer-exe
          path: output

      # Release notes link to upstream's changelog rather than duplicating it;
      # upstream is the authoritative source and stays current.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: ${{ env.NEW_VERSION }}
          prerelease: ${{ needs.smoke-test.outputs.exe_pass != 'true' }}
          body: |
            Unofficial automated build of FluentFlyout ${{ env.NEW_VERSION }}.

            ### 📋 What's new in this version
            This is a rebuild of upstream's release — see **[unchihugo's release notes for ${{ env.NEW_VERSION }}](https://github.com/unchihugo/FluentFlyout/releases/tag/${{ env.NEW_VERSION }})** for the full changelog, screenshots, and credits.

            See `build-provenance.json` for the exact source commit and build run used.

            ${{ needs.smoke-test.outputs.exe_pass == 'true' && 'New here? Download FluentFlyout_Installer.exe below and just run it - it handles everything (architecture detection, certificate trust, install, cleanup) on its own.' || '**Marked as a prerelease**: FluentFlyoutInstaller.exe failed automated smoke testing this build, so it is not attached. The .msix itself passed testing and is safe to use via the manual install steps in the README.' }}
          files: output/*

  # ----------------------------------------------------------------------------
  # Packs and pushes the Chocolatey package, then confirms it is actually listed.
  # Skipped entirely when the installer failed smoke testing.
  # ----------------------------------------------------------------------------
  publish-chocolatey:
    name: Publishing to Chocolatey
    needs: [check-release, sign-packages, smoke-test, publish]
    if: needs.smoke-test.outputs.exe_pass == 'true' && needs.check-release.outputs.publish_choco == 'true'
    runs-on: windows-latest
    # Includes the listing poll below, which can take up to three minutes.
    timeout-minutes: 25
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
    outputs:
      pkg_ver: ${{ steps.prep.outputs.pkg_ver }}
      choco_attempted: ${{ steps.verify.outputs.attempted }}
      choco_pushed: ${{ steps.verify.outputs.pushed }}
      choco_verified: ${{ steps.verify.outputs.verified }}
      choco_error: ${{ steps.verify.outputs.error }}
    steps:
      - uses: actions/checkout@v5

      - name: Download signed release assets (for checksums)
        uses: actions/download-artifact@v7
        with:
          name: signed-release
          path: output

      - name: Extract checksums
        id: sums
        run: |
          $lines = Get-Content output\SHA256SUMS.txt
          $x64Hash = (($lines | Where-Object { $_ -match "_x64\.msix" }) -split '\s+')[0]
          $armHash = (($lines | Where-Object { $_ -match "_ARM64\.msix" }) -split '\s+')[0]
          $certHash = (($lines | Where-Object { $_ -match "signing\.cer" }) -split '\s+')[0]
          echo "x64_hash=$x64Hash" >> $env:GITHUB_OUTPUT
          echo "arm_hash=$armHash" >> $env:GITHUB_OUTPUT
          echo "cert_hash=$certHash" >> $env:GITHUB_OUTPUT

      # Chocolatey (like all NuGet feeds) treats id+version as immutable once
      # published, so an untested build appends a revision segment and prerelease
      # tag (e.g. 2.14.0.47-untested) to keep repeat pushes of the same upstream
      # tag unique. A final build publishes the clean upstream version.
      #
      # The install script and .nuspec are templates; their placeholders are
      # filled in here and never committed with real values.
      - name: Prepare Chocolatey package
        id: prep
        run: |
          $ver = "${{ env.NEW_VERSION }}".TrimStart('v')
          $markUntested = "${{ needs.check-release.outputs.mark_untested }}"
          $pkgVer = if ($markUntested -eq 'true') { "$ver.${{ github.run_number }}-untested" } else { $ver }

          echo "PKG_VER=$pkgVer" >> $env:GITHUB_ENV
          echo "pkg_ver=$pkgVer" >> $env:GITHUB_OUTPUT

          (Get-Content chocolatey\fluentflyout-unofficial.nuspec -Raw) -replace '__VERSION__', $pkgVer | Set-Content chocolatey\fluentflyout-unofficial.nuspec
          (Get-Content chocolatey\tools\chocolateyinstall.ps1 -Raw) `
            -replace '__X64_SHA256__', "${{ steps.sums.outputs.x64_hash }}" `
            -replace '__ARM64_SHA256__', "${{ steps.sums.outputs.arm_hash }}" `
            -replace '__CERT_SHA256__', "${{ steps.sums.outputs.cert_hash }}" `
            | Set-Content chocolatey\tools\chocolateyinstall.ps1

      - name: Pack Chocolatey package
        run: |
          choco pack chocolatey\fluentflyout-unofficial.nuspec --outputdirectory chocolatey

      - name: Upload .nupkg for local testing
        if: needs.check-release.outputs.export_nupkg == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: chocolatey-package
          path: chocolatey\*.nupkg

      # continue-on-error keeps the job alive on a push failure so the verify
      # step below can classify it and surface a useful message.
      - name: Push to Chocolatey
        id: push
        if: needs.check-release.outputs.publish_choco == 'true'
        continue-on-error: true
        run: |
          choco push "chocolatey\fluentflyout-unofficial.$env:PKG_VER.nupkg" --source https://push.chocolatey.org/ --api-key "${{ secrets.CHOCO_API_KEY }}"

      # A successful push only means Chocolatey accepted the package for
      # processing, not that it is live, so the listing is polled until the
      # version actually appears. Sets the outputs consumed by publish-report.
      - name: Verify Chocolatey listing
        id: verify
        run: |
          $attempted = "${{ needs.check-release.outputs.publish_choco }}"
          echo "attempted=$attempted" >> $env:GITHUB_OUTPUT

          if ($attempted -ne 'true') {
            echo "pushed=false" >> $env:GITHUB_OUTPUT
            echo "verified=false" >> $env:GITHUB_OUTPUT
            echo "error=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $pushOutcome = "${{ steps.push.outcome }}"
          if ($pushOutcome -ne 'success') {
            echo "pushed=false" >> $env:GITHUB_OUTPUT
            echo "verified=false" >> $env:GITHUB_OUTPUT
            echo "error=choco push command itself failed (see the Push to Chocolatey step's log for the exact error, e.g. a 403)." >> $env:GITHUB_OUTPUT
            exit 1
          }
          echo "pushed=true" >> $env:GITHUB_OUTPUT

          $pkgVer = "$env:PKG_VER"
          $maxWaitSeconds = 180
          $intervalSeconds = 20
          $elapsed = 0
          $verified = $false

          while ($elapsed -lt $maxWaitSeconds) {
            try {
              $uri = "https://community.chocolatey.org/api/v2/Packages(Id='fluentflyout-unofficial',Version='$pkgVer')"
              $resp = Invoke-RestMethod -Uri $uri -Method Get -ErrorAction Stop
              if ($resp) { $verified = $true; break }
            } catch {
              # Not listed yet, or a transient error; keep polling.
            }
            Start-Sleep -Seconds $intervalSeconds
            $elapsed += $intervalSeconds
          }

          if ($verified) {
            echo "verified=true" >> $env:GITHUB_OUTPUT
            echo "error=" >> $env:GITHUB_OUTPUT
          } else {
            echo "verified=false" >> $env:GITHUB_OUTPUT
            echo "error=Push command succeeded, but the package was not found on the Chocolatey feed after waiting ${maxWaitSeconds}s. It may still appear later - check the package page directly." >> $env:GITHUB_OUTPUT
            exit 1
          }

  # ----------------------------------------------------------------------------
  # Sends exactly one summary notification per run, whatever the outcome.
  #
  # Depends on every build-stage job so it can name the stage that actually
  # failed. Without this, an upstream failure would be misreported as a publish
  # failure, since publish would simply have been skipped.
  # ----------------------------------------------------------------------------
  publish-report:
    name: Final Publish Report
    needs: [check-release, build, sign-packages, package-installer, smoke-test, publish, publish-chocolatey]
    # Gated on should_build so scheduled runs that find nothing to build stay
    # silent instead of reporting a failure for a version that was never built.
    if: always() && needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEW_VERSION: ${{ needs.check-release.outputs.new_version }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Build and send final report
        if: env.NTFY_TOPIC != ''
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BUILD_RESULT="${{ needs.build.result }}"
          SIGN_RESULT="${{ needs.sign-packages.result }}"
          INSTALLER_RESULT="${{ needs.package-installer.result }}"
          SMOKE_RESULT="${{ needs.smoke-test.result }}"
          MSIX_PASS="${{ needs.smoke-test.outputs.msix_pass }}"
          GITHUB_OK="${{ needs.publish.result == 'success' }}"
          CHOCO_ATTEMPTED="${{ needs.publish-chocolatey.outputs.choco_attempted }}"
          CHOCO_VERIFIED="${{ needs.publish-chocolatey.outputs.choco_verified }}"
          CHOCO_ERROR="${{ needs.publish-chocolatey.outputs.choco_error }}"
          PKG_VER="${{ needs.publish-chocolatey.outputs.pkg_ver }}"

          # Walk the pipeline in order and report the first stage that broke.
          # A 'cancelled' result here is almost always a timeout-minutes hit,
          # which points at a hung step and needs a different fix from a normal
          # failure - so the two are worded differently.
          if [ "$BUILD_RESULT" != "success" ]; then
            STAGE="Build"; STAGE_RESULT="$BUILD_RESULT"
          elif [ "$SIGN_RESULT" != "success" ]; then
            STAGE="Signing"; STAGE_RESULT="$SIGN_RESULT"
          elif [ "$INSTALLER_RESULT" != "success" ]; then
            STAGE="Installer build"; STAGE_RESULT="$INSTALLER_RESULT"
          elif [ "$SMOKE_RESULT" != "success" ]; then
            STAGE="Smoke test"; STAGE_RESULT="$SMOKE_RESULT"
          else
            STAGE=""
          fi

          if [ -n "$STAGE" ]; then
            if [ "$STAGE_RESULT" = "cancelled" ]; then
              REASON="timed out (likely a hung step) or was cancelled"
            else
              REASON="failed"
            fi
            TITLE="FluentFlyout Unofficial ${{ env.NEW_VERSION }} — $STAGE $REASON"
            PRIORITY="high"
            TAGS="x"
            BODY="The $STAGE stage $REASON, so nothing was published for ${{ env.NEW_VERSION }}. The next scheduled run will retry automatically. Details: $RUN_URL"
          elif [ "$MSIX_PASS" = "false" ]; then
            TITLE="FluentFlyout Unofficial ${{ env.NEW_VERSION }} release cancelled"
            PRIORITY="high"
            TAGS="x"
            BODY="Release for ${{ env.NEW_VERSION }} was cancelled: the .msix failed smoke testing, so nothing was published. See the smoke test report for details."
          elif [ "$GITHUB_OK" != "true" ]; then
            TITLE="FluentFlyout Unofficial ${{ env.NEW_VERSION }} publish failed"
            PRIORITY="high"
            TAGS="x"
            BODY="Everything built and tested fine, but creating the GitHub Release for ${{ env.NEW_VERSION }} failed. Details: $RUN_URL"
          elif [ "$CHOCO_ATTEMPTED" != "true" ]; then
            TITLE="FluentFlyout Unofficial ${{ env.NEW_VERSION }} published"
            PRIORITY="low"
            TAGS="package"
            BODY="New GitHub Release for ${{ env.NEW_VERSION }} is live. (Chocolatey publishing was not enabled for this run.)"
          elif [ "$CHOCO_VERIFIED" = "true" ]; then
            TITLE="FluentFlyout Unofficial ${{ env.NEW_VERSION }} published"
            PRIORITY="high"
            TAGS="package"
            BODY="New GitHub Release for ${{ env.NEW_VERSION }} is live. Chocolatey package $PKG_VER confirmed live too."
          else
            TITLE="FluentFlyout Unofficial ${{ env.NEW_VERSION }} publish failed"
            PRIORITY="high"
            TAGS="package"
            if [ -n "$CHOCO_ERROR" ]; then
              BODY="New GitHub Release for ${{ env.NEW_VERSION }} is live. But, publishing to Chocolatey has failed. $CHOCO_ERROR"
            else
              BODY="New GitHub Release for ${{ env.NEW_VERSION }} is live. But, publishing to Chocolatey has failed. Details: $RUN_URL"
            fi
          fi

          curl -s \
            -H "Title: $TITLE" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -d "$BODY" \
            "https://ntfy.sh/$NTFY_TOPIC"
